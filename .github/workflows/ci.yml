name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PROMETHEUS_IMAGE: prom/prometheus:v3.13.5
  ALERTMANAGER_IMAGE: prom/alertmanager:v0.27.0
  HADOLINT_IMAGE: hadolint/hadolint:v2.12.0
  TRIVY_IMAGE: aquasec/trivy:0.57.1

jobs:
  validate:
    name: Validate configs and rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the Prometheus config
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml

      - name: Unit-test the alert rules
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            "$PROMETHEUS_IMAGE" test rules /etc/prometheus/tests/alerts_test.yml

      - name: Check the Alertmanager config
        run: |
          docker run --rm -v "$PWD/alertmanager:/etc/alertmanager:ro" --entrypoint amtool \
            "$ALERTMANAGER_IMAGE" check-config /etc/alertmanager/alertmanager.yml

      - name: Check the Grafana dashboard is valid JSON
        run: jq empty grafana/dashboards/*.json

      - name: Check the compose file
        run: docker compose config --quiet

      - name: Lint the app Dockerfile
        run: docker run --rm -i "$HADOLINT_IMAGE" hadolint - < app/Dockerfile

      - name: Scan for secrets and misconfigurations
        run: |
          docker run --rm -v "$PWD:/src" "$TRIVY_IMAGE" fs \
            --scanners secret,misconfig --severity HIGH,CRITICAL --exit-code 1 /src

  smoke:
    name: Start the stack and test it
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: docker compose up -d --build

      - name: Smoke test
        run: ./scripts/smoke.sh

      - name: Show container logs when something failed
        if: failure()
        run: docker compose logs --no-color --tail=100

      - name: Stop the stack
        if: always()
        run: docker compose down -v
