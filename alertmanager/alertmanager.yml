route:
  receiver: demo-webhook
  group_by: [alertname, job]
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: demo-webhook
      repeat_interval: 30m

receivers:
  - name: demo-webhook
    webhook_configs:
      - url: http://demo-app:8000/alerts
        send_resolved: true

# If a critical alert is already firing for a job, the warnings for the same job
# add noise, not information, so they are muted.
inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [job]
